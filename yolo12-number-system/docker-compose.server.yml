services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-number_system}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-number_system}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    environment:
      ML_DEVICE: "${ML_DEVICE:-auto}"
    volumes:
      - ml_runs:/app/runs
      - ml_tmp:/app/tmp
    # For NVIDIA GPU server uncomment the line below and set ML_DEVICE=cuda:0.
    # Requires NVIDIA driver and NVIDIA Container Toolkit on the host.
    # gpus: all
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-number_system}?sslmode=disable"
      API_KEY: "${API_KEY:-super-secret-key}"
      ML_SERVICE_URL: "http://ml_service:8000"
      TASK_WORKERS: "${TASK_WORKERS:-2}"
      UPLOAD_DIR: "uploads"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  ml_runs:
  ml_tmp:
